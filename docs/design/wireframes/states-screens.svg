  <polyline points="1036.0,475.9 1076.4,475.9 1116.8,475.9 1157.3,475.9 1197.7,475.9 1238.1,475.9 1278.5,475.9 1318.9,475.9 1359.4,475.9 1399.8,475.9 1440.2,475.9 1480.6,475.9 1521.1,475.9 1561.5,475.9 1601.9,475.9 1642.3,475.9 1682.7,475.9 1723.2,475.9 1763.6,475.9 1804.0,475.9" fill="none" stroke="#2FB8DE" stroke-width="2.4" opacity="1"/>
  <text class="capo" x="80" y="660">C · «ЧАТ» — САЙДКАР НЕ ПОДКЛЮЧЁН</text>
  <rect class="panel" x="80" y="678" width="840" height="430"/>
  <text class="ann" x="80" y="1138">Инструкция вместо пустого поля (V-03). Игра не блокируется,</text>
  <text class="ann" x="80" y="1160">«Статистика» рядом работает: телеметрию собирает мод (FR-10).</text>
  <text class="cap" x="100" y="718" font-size="14">CHAT WITH AI</text>
  <text class="err" x="900" y="718" text-anchor="end">SIDECAR  NOT CONNECTED</text>
  <rect class="inner" x="100" y="734" width="800" height="246"/>
  <circle cx="500" cy="806" r="26" fill="none" stroke="#6A8398" stroke-width="2.4"/>
  <line class="" x1="482" y1="824" x2="518" y2="788" stroke="#6A8398" stroke-width="2.4"/>
  <text class="cap" x="500" y="872" text-anchor="middle" font-size="18">NOT CONNECTED</text>
  <text class="tm" x="500" y="900" text-anchor="middle">Start the FICSIT AI sidecar, then open the chat again</text>
  <text class="tt" x="500" y="926" text-anchor="middle">Launcher: FICSIT AI / start.sh  ·  retries automatically</text>
  <rect class="inner" x="100" y="996" width="680" height="48"/>
  <text class="tt" x="116" y="1026">Chat is unavailable while the sidecar is offline</text>
  <rect class="inner" x="792" y="996" width="108" height="48"/>
  <text class="ts" x="846" y="1026" text-anchor="middle" style="fill:#55728A">SEND</text>
  <text class="capo" x="1000" y="660">D · «ЧАТ» — ДВА ВИДА ПУСТОЙ ИСТОРИИ</text>
  <rect class="panel" x="1000" y="678" width="840" height="430"/>
  <text class="ann" x="1000" y="1138">Недоступная история и пустая история — разные состояния: §10 хранит</text>
  <text class="ann" x="1000" y="1160">переписку в БД Foreman, и «не загрузили» нельзя показывать как «пусто».</text>
  <text class="ts" x="1020" y="718" style="fill:#E8C33C">D1 · ИСТОРИЯ НЕ ЗАГРУЖЕНА</text>
  <rect class="inner" x="1020" y="730" width="800" height="150"/>
  <rect class="" x="1032" y="742" width="776" height="34" fill="#1C2A1F" stroke="#E8C33C" stroke-width="1.5"/>
  <text class="ts" x="1046" y="764" style="fill:#E8C33C">HISTORY UNAVAILABLE — sidecar offline, earlier messages are not loaded</text>
  <rect class="slot" x="1032" y="790" width="420" height="32"/>
  <text class="tm" x="1046" y="811">How much power do I produce?</text>
  <rect class="" x="1384" y="830" width="420" height="32" fill="#0C2030" stroke="#1E3D59" stroke-width="1.5"/>
  <text class="tm" x="1398" y="851">Current production is 1.20 GW.</text>
  <text class="ts" x="1020" y="904" style="fill:#8FA9BF">D2 · ИСТОРИЯ ЗАГРУЖЕНА И ПУСТА</text>
  <rect class="inner" x="1020" y="916" width="800" height="150"/>
  <text class="cap" x="1420" y="984" text-anchor="middle" font-size="17">No messages yet</text>
  <text class="tm" x="1420" y="1010" text-anchor="middle">Ask the first question — the answer is saved to this playthrough</text>
  <text class="annd" x="80" y="1176">Подписи интерфейса английские и окончательные — это строки для UE Localization. Пояснения на макете русские и в интерфейс не попадают.</text>
</svg>
