<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" font-family="DejaVu Sans, Verdana, sans-serif">
  <title>FICSIT AI - screen states: no data, empty factory, sidecar offline, history (D-1)</title>
  <defs><style>
    .bg{fill:#071320}
    .panel{fill:#0E2032;stroke:#1E3D59;stroke-width:2}
    .inner{fill:#0A1724;stroke:#1E3D59;stroke-width:1.5}
    .slot{fill:#122A40;stroke:#1E3D59;stroke-width:2}
    .sep{fill:#1E3D59}
    .h{fill:#E6F0F7;font-size:21px;font-weight:bold;letter-spacing:1px}
    .cap{fill:#E6F0F7;font-size:15px;letter-spacing:2px;font-weight:bold}
    .capo{fill:#F5871F;font-size:16px;font-weight:bold;letter-spacing:2px}
    .t{fill:#E6F0F7;font-size:17px}
    .tm{fill:#8FA9BF;font-size:15px}
