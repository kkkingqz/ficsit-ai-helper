  <text class="neu" x="900" y="180" text-anchor="end">NO DATA</text>
  <rect class="inner" x="100" y="206" width="180" height="62"/>
  <text class="tt" x="112" y="228">PRODUCTION</text>
  <text class="bigd" x="112" y="256" font-size="20" font-weight="bold">—</text>
  <rect class="inner" x="296" y="206" width="180" height="62"/>
