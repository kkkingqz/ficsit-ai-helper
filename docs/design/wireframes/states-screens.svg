</style></defs>
  <rect class="bg" x="0" y="0" width="1920" height="1200"/>
  <text class="h" x="80" y="48">СОСТОЯНИЯ ЭКРАНОВ: НЕТ ДАННЫХ, ПУСТАЯ ФАБРИКА, НЕТ САЙДКАРА, ИСТОРИЯ</text>
  <text class="ann" x="80" y="78">Область модуля 1740 x 960 показана схематично. Каркас вокруг не рисуется: он свой и описан в D-1-frame; два полноэкранных состояния каркаса — в frame-states.svg.</text>
  <text class="capo" x="80" y="120">A · «СТАТИСТИКА» — ТЕЛЕМЕТРИИ ЕЩЁ НЕТ</text>
  <rect class="panel" x="80" y="138" width="840" height="430"/>
  <text class="ann" x="80" y="598">Сбор начинается с загрузки сохранения (§8.2). Это информационное</text>
  <text class="ann" x="80" y="620">сообщение, а не ошибка: V-02 требует именно такой формулировки.</text>
  <rect class="slot" x="100" y="158" width="140" height="32"/>
  <rect class="" x="100" y="188" width="140" height="3" fill="#F5871F" stroke="none"/>
  <text class="ts" x="116" y="180">ENERGY</text>
  <rect class="inner" x="250" y="158" width="140" height="32"/>
