  <line class="grid" x1="788" y1="301" x2="788" y2="427"/>
  <text class="cap" x="500" y="358" text-anchor="middle" font-size="18">NO DATA YET</text>
  <text class="tm" x="500" y="384" text-anchor="middle">Collection starts with the save — session data only</text>
  <text class="tt" x="116" y="458">Session data only — 24 h history arrives in v1.1</text>
  <text class="capo" x="1000" y="120">B · «СТАТИСТИКА» — ПУСТАЯ ФАБРИКА</text>
  <rect class="panel" x="1000" y="138" width="840" height="430"/>
  <text class="ann" x="1000" y="598">Данные есть и свежие, фабрики нет. Поэтому ноль, а не прочерк,</text>
  <text class="ann" x="1000" y="620">и зелёная метка: это ответ, а не отсутствие ответа.</text>
  <rect class="inner" x="1020" y="158" width="140" height="32"/>
  <text class="ts" x="1036" y="180">ENERGY</text>
  <rect class="slot" x="1170" y="158" width="140" height="32"/>
  <rect class="" x="1170" y="188" width="140" height="3" fill="#F5871F" stroke="none"/>
