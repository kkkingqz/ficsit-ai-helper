    .ann{fill:#9CC4DB;font-size:14px}
    .annd{fill:#6F8CA3;font-size:13px}
    .big{fill:#E6F0F7;font-size:44px;font-weight:bold}
    .bigd{fill:#7E99AE;font-size:44px;font-weight:bold}
    .ok{fill:#46C46B;font-size:13px;font-weight:bold;letter-spacing:1px}
    .stale{fill:#E8C33C;font-size:13px;font-weight:bold;letter-spacing:1px}
