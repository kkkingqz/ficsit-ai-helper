    .grid{stroke:#16304A;stroke-width:1}
</style></defs>
  <rect class="bg" x="0" y="0" width="1920" height="1290"/>
  <text class="h" x="80" y="48">ЭКРАН В МИРЕ: ПРОПОРЦИЯ 16:9 И ЗАГЛУШКА v0.1</text>
  <text class="ann" x="80" y="78">Опорная сетка 1920 x 1080, как у каркаса. В мире нет рельса и полосы клавиш (§6.6, ответ Co3-2): остаются полоса статуса и область модуля, вместе 16:9.</text>
  <text class="ann" x="80" y="100">Render target по умолчанию 1280 x 720 — это та же композиция в масштабе 66,7 %.</text>
  <text class="capo" x="80" y="126">A · КОМПОЗИЦИЯ И РАЗМЕРЫ</text>
  <text class="ann" x="80" y="644">Полоса статуса в мире выше, чем в каркасе: 96 px против 64 в той же</text>
  <text class="ann" x="80" y="666">опорной сетке. Иначе при 1280 x 720 её подписи дают 8,7 px и не читаются.</text>
  <rect class="panel" x="80" y="140" width="840" height="472"/>
  <rect class="" x="80" y="140" width="840" height="41.9556" fill="#0E2032" stroke="none"/>
  <line class="" x1="80" y1="181.956" x2="920" y2="181.956" stroke="#1E3D59" stroke-width="2"/>
  <text class="ts" x="96" y="166.978">ПОЛОСА СТАТУСА · 1920 x 96</text>
  <text class="ts" x="904" y="166.978" text-anchor="end" style="fill:#F5871F">16:9</text>
  <rect class="" x="94" y="195.956" width="812" height="402.044" fill="none" stroke="#F5871F" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="cap" x="500" y="396.978" text-anchor="middle" font-size="18">ОБЛАСТЬ МОДУЛЯ</text>
  <text class="tm" x="500" y="426.978" text-anchor="middle">1920 x 984 в опорной сетке</text>
  <text class="tt" x="500" y="452.978" text-anchor="middle">1280 x 656 при render target 1280 x 720</text>
  <text class="tt" x="500" y="588" text-anchor="middle">ни рельса, ни полосы клавиш: органов ввода у меша нет</text>
  <text class="capo" x="1000" y="126">B · ЗАГЛУШКА v0.1, КАК ЕЁ ВИДНО В МИРЕ</text>
  <text class="ann" x="1000" y="644">Экранов-конструкторов в v0.1 ещё нет, поэтому терминал показывает одно</text>
  <text class="ann" x="1000" y="666">ключевое число и тренд. Читается с нескольких шагов, а не с вытянутой руки.</text>
  <rect class="panel" x="1000" y="140" width="840" height="472"/>
  <rect class="" x="1000" y="140" width="840" height="41.9556" fill="#0E2032" stroke="none"/>
  <line class="" x1="1000" y1="181.956" x2="1840" y2="181.956" stroke="#1E3D59" stroke-width="2"/>
  <text class="cap" x="1016" y="167.978" font-size="16">FICSIT AI TERMINAL</text>
  <circle cx="1388" cy="160.978" r="6" fill="#46C46B"/>
  <text class="ts" x="1402" y="166.978" style="fill:#46C46B">LIVE</text>
  <circle cx="1470" cy="160.978" r="6" fill="#46C46B"/>
  <text class="ts" x="1484" y="166.978" style="fill:#46C46B">LINKED</text>
  <text class="cap" x="1824" y="167.978" text-anchor="end" font-size="16">1.20 / 1.50 GW</text>
  <text class="big" x="1420" y="330" text-anchor="middle" font-size="86">1.20 GW</text>
  <text class="ts" x="1420" y="364" text-anchor="middle">TOTAL PRODUCTION  ·  UPDATED 2 s AGO</text>
  <rect class="inner" x="1090" y="396" width="660" height="120"/>
  <line class="grid" x1="1091" y1="436" x2="1749" y2="436"/>
  <line class="grid" x1="1091" y1="476" x2="1749" y2="476"/>
  <line class="grid" x1="1172.5" y1="397" x2="1172.5" y2="515"/>
  <line class="grid" x1="1255" y1="397" x2="1255" y2="515"/>
  <line class="grid" x1="1337.5" y1="397" x2="1337.5" y2="515"/>
  <line class="grid" x1="1420" y1="397" x2="1420" y2="515"/>
  <line class="grid" x1="1502.5" y1="397" x2="1502.5" y2="515"/>
  <line class="grid" x1="1585" y1="397" x2="1585" y2="515"/>
  <line class="grid" x1="1667.5" y1="397" x2="1667.5" y2="515"/>
  <polyline points="1090.0,426.6 1112.8,427.0 1135.5,431.6 1158.3,439.2 1181.0,448.2 1203.8,456.2 1226.6,461.4 1249.3,462.8 1272.1,460.4 1294.8,455.2 1317.6,449.2 1340.3,444.3 1363.1,442.1 1385.9,443.2 1408.6,447.3 1431.4,452.9 1454.1,458.1 1476.9,460.9 1499.7,460.2 1522.4,455.6 1545.2,448.0 1567.9,439.2 1590.7,431.4 1613.4,426.5 1636.2,425.6 1659.0,428.9 1681.7,435.2 1704.5,442.8 1727.2,449.5 1750.0,453.6" fill="none" stroke="#2FB8DE" stroke-width="3" opacity="1"/>
  <text class="ts" x="1420" y="586" text-anchor="middle">PRESS  E  TO OPEN</text>
  <circle cx="1270" cy="310" r="13" fill="none" stroke="#F5871F" stroke-width="2"/>
  <text class="ts" x="1270" y="315" text-anchor="middle" style="fill:#F5871F">1</text>
  <circle cx="1300" cy="160.978" r="13" fill="none" stroke="#F5871F" stroke-width="2"/>
  <text class="ts" x="1300" y="165.978" text-anchor="middle" style="fill:#F5871F">2</text>
  <circle cx="1120" cy="440" r="13" fill="none" stroke="#F5871F" stroke-width="2"/>
  <text class="ts" x="1120" y="445" text-anchor="middle" style="fill:#F5871F">3</text>
  <text class="capo" x="80" y="706">C · ДВА РАКУРСА ОДНОЙ СЦЕНЫ ДЛЯ СВЕРКИ С АССЕТОМ</text>
  <text class="ann" x="80" y="1224">Порядок чтения с нескольких шагов: 1 — ключевое число, 2 — верхний статус,</text>
  <text class="ann" x="80" y="1246">3 — тренд. Под углом сначала теряется тренд, и это допустимо; число и статус — нет.</text>
  <rect class="panel" x="80" y="720" width="840" height="472"/>
  <text class="ts" x="116" y="776">ПРЯМО</text>
  <rect class="inner" x="116" y="810" width="360" height="203"/>
  <rect class="" x="116" y="810" width="360" height="18.0444" fill="#0E2032" stroke="none"/>
  <text class="big" x="296" y="921.5" text-anchor="middle" font-size="38">1.20 GW</text>
  <polyline points="146.0,966.1 159.0,966.2 172.1,967.6 185.1,970.0 198.2,972.9 211.2,975.4 224.3,977.0 237.3,977.5 250.3,976.7 263.4,975.1 276.4,973.2 289.5,971.6 302.5,970.9 315.6,971.3 328.6,972.6 341.7,974.3 354.7,976.0 367.7,976.9 380.8,976.6 393.8,975.2 406.9,972.8 419.9,970.0 433.0,967.6 446.0,966.0" fill="none" stroke="#2FB8DE" stroke-width="2" opacity="1"/>
  <text class="ts" x="532" y="776">ПОД УГЛОМ ~35°</text>
  <polygon points="532,836 832,810 832,1013 532,987" fill="#0A1724" stroke="#1E3D59" stroke-width="2"/>
  <polygon points="532,836 832,810 832,828 532,854" fill="#0E2032" stroke="none"/>
  <text class="big" x="682" y="923.5" text-anchor="middle" font-size="34">1.20 GW</text>
  <text class="annd" x="116" y="1164">Одинаковые данные на обоих ракурсах — иначе сверка проверяет не читаемость, а совпадение чисел.</text>
  <text class="capo" x="1000" y="706">D · СОСТОЯНИЯ ЭКРАНА В МИРЕ</text>
  <text class="ann" x="1000" y="1224">На резервном питании экран показывает статичную картинку с ошибкой на</text>
  <text class="ann" x="1000" y="1246">приглушённой яркости: один рендер, без полосы статуса и без живого браузера.</text>
  <rect class="panel" x="1000" y="720" width="840" height="472"/>
  <text class="ts" x="1030" y="786">НЕТ ПИТАНИЯ</text>
  <rect class="" x="1030" y="800" width="240" height="135" fill="#0A1724" stroke="#16304A" stroke-width="2"/>
  <text class="cap" x="1150" y="855.5" text-anchor="middle" font-size="19" style="fill:#8FA9BF">NO POWER</text>
  <text class="tt" x="1150" y="879.5" text-anchor="middle">This terminal requires 10 MW</text>
  <text class="tt" x="1150" y="901.5" text-anchor="middle" font-size="10">Notes and screens are not lost</text>
  <text class="ts" x="1292" y="786">ИНЕРТЕН</text>
  <rect class="inner" x="1292" y="800" width="240" height="135"/>
  <rect class="" x="1292" y="800" width="240" height="12" fill="#0E2032" stroke="none"/>
  <text class="cap" x="1412" y="867.5" text-anchor="middle" font-size="14">INERT MODE</text>
  <text class="tt" x="1412" y="889.5" text-anchor="middle">multiplayer session</text>
  <text class="ts" x="1554" y="786">СОДЕРЖИМОГО ЕЩЁ НЕ БЫЛО</text>
  <rect class="inner" x="1554" y="800" width="240" height="135"/>
  <rect class="" x="1554" y="800" width="240" height="12" fill="#0E2032" stroke="none"/>
  <text class="cap" x="1674" y="867.5" text-anchor="middle" font-size="14">NO CONTENT YET</text>
  <text class="tt" x="1674" y="889.5" text-anchor="middle">open with E to start</text>
  <text class="ann" x="1030" y="988">Последняя рабочая картинка на обесточенном терминале не показывается: кэш §10.1 — для</text>
  <text class="ann" x="1030" y="1010">терминала, который ещё не получал содержимого. Показать кэш вместо NO POWER значит</text>
  <text class="ann" x="1030" y="1032">оставить старые цифры на мёртвом экране, и игрок прочитает их как живые.</text>
  <text class="annd" x="1030" y="1072">Яркость и контраст в мире выше, чем в окне: экран светится в тёмном цеху и читается под углом.</text>
  <text class="annd" x="1030" y="1094">На резерве яркость наоборот ниже рабочей. И то и другое — настройка материала, а не второй набор токенов.</text>
  <text class="annd" x="80" y="1266">Сверка с ассетом art/command-center — S7, неделя 5. Проверяется посадка композиции на меш, а не содержимое экрана.</text>
</svg>
