<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1290" width="1920" height="1290" font-family="DejaVu Sans, Verdana, sans-serif">
  <title>FICSIT AI - world screen 16:9 and v0.1 placeholder (D-1)</title>
  <defs><style>
    .bg{fill:#071320}
    .panel{fill:#0E2032;stroke:#1E3D59;stroke-width:2}
    .inner{fill:#0A1724;stroke:#1E3D59;stroke-width:1.5}
