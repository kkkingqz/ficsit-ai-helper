  <text class="ann" x="1280" y="888">Свежий ноль — обычное число с зелёной меткой и рядом по нулю.</text>
  <text class="ann" x="1280" y="910">Отсутствие данных нулём не рисуется никогда: иначе погасшая</text>
  <text class="ann" x="1280" y="932">сеть и неработающая телеметрия выглядят одинаково.</text>
  <text class="annd" x="80" y="1002">Цвета — предварительные с концепта; источник истины по цвету — токены D-2 (Gs2). Геометрия и состав состояний — D-1.</text>
