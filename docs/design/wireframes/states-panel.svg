  <text class="cap" x="700" y="162" font-size="14">POWER — PRODUCTION</text>
  <text class="neu" x="1220" y="162" text-anchor="end">LOADING</text>
  <text class="bigd" x="700" y="244">—</text>
  <text class="tt" x="700" y="272">Current production, 15 min window</text>
