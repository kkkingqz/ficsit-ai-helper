  <rect class="bg" x="0" y="0" width="1920" height="1030"/>
  <text class="h" x="80" y="48">ПЯТЬ СОСТОЯНИЙ ПАНЕЛИ — ОДНА СЕТКА</text>
  <text class="ann" x="80" y="78">Одна и та же панель «Статистики» во всех состояниях. Сетка общая для обоих экранов: D-2 делает один компонент, Fixture проверяет один набор. Правила — D-1-screens §1.1.</text>
