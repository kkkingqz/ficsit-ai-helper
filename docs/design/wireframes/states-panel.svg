  <text class="annd" x="100" y="842">Telemetry starts with the save — no samples yet</text>
  <text class="capo" x="80" y="544">4 · EMPTY</text>
  <text class="ann" x="80" y="888">Прочерк и пустая сетка. Причина — строкой в панели,</text>
  <text class="ann" x="80" y="910">иначе пустая панель неотличима от сломанной.</text>
