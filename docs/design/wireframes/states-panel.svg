  <text class="cap" x="100" y="162" font-size="14">POWER — PRODUCTION</text>
  <text class="ok" x="620" y="162" text-anchor="end">UPDATED 2 s AGO</text>
  <text class="big" x="100" y="244">1.20 GW</text>
  <text class="tt" x="100" y="272">Current production, 15 min window</text>
